server:
  port: 8089

spring:
  application:
    name: cobros-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cobros_db}
    username: ${DB_USER:biblioteca}
    password: ${DB_PASS:biblioteca}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: /

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: localhost
    prefer-ip-address: false
    non-secure-port: 8089

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.biblioteca.cobros: DEBUG
    org.springframework.amqp: INFO
