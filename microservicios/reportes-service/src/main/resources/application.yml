server:
  port: 8087

spring:
  application:
    name: reportes-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reportes_db}
    username: ${DB_USER:biblioteca}
    password: ${DB_PASS:biblioteca}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
